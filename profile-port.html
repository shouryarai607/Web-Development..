<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">

  <div class="relative">

    <!-- Outer Circle Border -->
    <div class="w-96 h-96 rounded-full border-2 border-dashed border-orange-500 flex items-center justify-center">

      <!-- Profile Image -->
      <div class="w-80 h-80 rounded-full overflow-hidden border-4 border-gray-800">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330"
             class="w-full h-full object-cover" />
      </div>

    </div>

       <!-- this both are seperate -->

    <!-- Left Floating Card -->
    <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2
                bg-gray-900 text-white px-6 py-4 rounded-2xl shadow-lg">

      <h2 class="text-3xl font-bold text-emerald-400">50+</h2>
      <p class="text-sm text-gray-400">Projects</p>

    </div>

    <!-- Right Floating Card -->
    <div class="absolute right-0 top-1/3 translate-x-1/2
                bg-gray-900 text-white px-6 py-4 rounded-2xl shadow-lg">

      <h2 class="text-3xl font-bold text-orange-400">5+</h2>
      <p class="text-sm text-gray-400">Years Exp.</p>

    </div>

  </div>



 <div class="relative w-96 h-96 flex items-center justify-center">

  <!-- OUTER CIRCLE (Animated) -->
  <div class="absolute w-full h-full rounded-full 
              border-2 border-dashed border-orange-500
              animate-[spin_8s_linear_infinite]">
  </div>

  <!-- INNER IMAGE (NOT Animated) -->
  <div class="w-80 h-80 rounded-full overflow-hidden border-4 border-gray-800 z-10">
    <img src="your-image.jpg" class="w-full h-full object-cover" />
  </div>

</div>

</body>
</html>
